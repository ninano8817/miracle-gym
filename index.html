<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Miracle GYM">
<meta name="theme-color" content="#F5F5F2">
<title>Miracle GYM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#F5F5F2;--card:#FFFFFF;--ink:#1C1C1A;--sub:#5F5F5A;--line:#E4E3DE;--line2:#EFEEE9;--acc:#1F7A5C;--acc2:#155A43;--accsoft:#E3F1EA;--blue:#2F6FB3;--warn:#B4541F;--warnsoft:#FBEEE4;--dark:#1C1C1A;--mint:#4CC395}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1C1C1A;--ink:#ECEBE6;--sub:#A3A29C;--line:#2E2E2B;--line2:#262624;--acc:#4CC395;--acc2:#7FD9B3;--accsoft:#173126;--blue:#6AA6E8;--warn:#E58A52;--warnsoft:#33221A;--dark:#000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.35}
input,select,textarea{font-size:16px}/* iOS: 16px 미만 입력칸은 탭할 때 화면이 확대됨 */
html,body{overflow-x:hidden;max-width:100%}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.page{max-width:560px;margin:0 auto;padding:14px 14px 110px;display:flex;flex-direction:column;gap:12px}
.page.sheet{padding-bottom:20px}
.center{text-align:center;padding:80px 20px}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hdr h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.4px}
.brand{font-size:30px;font-weight:900;color:var(--acc);letter-spacing:-.5px}
.brandsm{font-size:13px;font-weight:800;color:var(--acc)}
.muted{color:var(--sub)}.sm{font-size:12.5px}.lg{font-size:16px}.b{font-weight:700}.acc{color:var(--acc)}.soft{color:#C9C8C2}.warnt{color:var(--warn)}.right{text-align:right}.pad{padding:12px}.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px}.g4{gap:4px}.g6{gap:6px}.col{display:flex;flex-direction:column;gap:6px}.f1{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card.tap{cursor:pointer}
.card.dark{background:var(--dark);color:#fff;border-color:var(--dark)}
.card.list{padding:4px 14px}
.big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}.big small,.huge small{font-size:13px;font-weight:500;color:var(--sub)}
.huge{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.bignum{font-size:22px;font-weight:800;padding:6px 8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.bar.lg{height:10px;border-radius:5px}
.bar i{display:block;height:100%;background:var(--acc)}.bar i.blue{background:var(--blue)}
.mini{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.mini i{display:block;height:100%;background:var(--mint);border-radius:3px}.mini i.warnbg{background:#E58A52}
.mini.light{background:var(--line);height:10px;border-radius:5px}.mini.light i{background:var(--acc)}.mini.light i.warnbg{background:var(--warn)}
.mini.dk{background:#3A3A37}
.btn{white-space:nowrap;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{min-height:38px;padding:0 12px}
.btn.go{background:var(--mint);border:0;color:#10241B;font-size:16px;font-weight:800;min-height:48px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}.iconbtn.round{border-radius:50%}.iconbtn.acc{color:var(--acc)}
.chipbtn{height:34px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;white-space:nowrap}
.chipbtn.acc{background:var(--accsoft);border-color:transparent;color:var(--acc2);font-weight:800}
.linkbtn{color:var(--acc);font-weight:700;font-size:14px;padding:6px 2px;text-align:left}
.datebar{display:flex;align-items:center;gap:4px}
.datechip{height:38px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;white-space:nowrap}
.syncdot{width:8px;height:8px;border-radius:4px;background:var(--line);display:inline-block}.syncdot.ok{background:var(--acc)}.syncdot.saving{background:#E0B153}.syncdot.err{background:#C2362B}
.mrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line2)}.mrow:last-child{border-bottom:0}
.mtext{flex:1;min-width:0;display:flex;flex-direction:column;text-align:left}.mtext span{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:26px;height:26px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center}.dot.done{background:var(--acc);color:#fff}.dot.empty{border:2px dashed #B4B3AD}
.excard{display:flex;flex-direction:column;gap:6px}
.pill{white-space:nowrap;font-size:12px;font-weight:700;color:var(--acc2);background:var(--accsoft);border-radius:999px;padding:4px 10px}
.sethead,.setrow{display:grid;grid-template-columns:26px minmax(0,1.15fr) minmax(0,1fr) minmax(0,.8fr) 44px;gap:6px;align-items:center}
.sethead{font-size:11px;color:var(--sub);padding:2px}
.setrow{padding:4px 2px;border-radius:10px}.setrow.done{background:var(--accsoft)}
.sn{text-align:center;font-weight:700;font-size:13px}.prev{font-size:12.5px;color:var(--sub)}
.cell{position:relative;display:block}.cell input{text-align:center;font-weight:700;font-size:16px;padding:7px 2px;height:40px}
.cell small{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9.5px;line-height:12px;color:var(--sub);pointer-events:none}.cell:has(small:not(:empty)) input{padding:0 2px 12px;line-height:20px}
.cell.na{text-align:center;color:var(--sub)}
.chk{width:44px;height:40px;border-radius:9px;border:1.5px solid #B4B3AD;color:#9A9993;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dashed{min-height:50px;border-radius:14px;border:1.5px dashed #B4B3AD;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;color:var(--sub)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:0 12px;flex:1;color:var(--sub)}
.search input{border:0;background:transparent;padding:11px 0;font-size:16px;color:var(--ink)}.search input:focus{outline:none}
.searchhead{display:flex;flex-direction:column;gap:10px;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:5}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;white-space:nowrap}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.toggle{font-size:14px;padding:0 2px}.toggle input{width:44px;height:26px;accent-color:var(--acc)}
.sec{font-size:12px;font-weight:700;color:var(--sub);padding:6px 4px 0}
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.lrow img,.lrow .ph{width:52px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--accsoft);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.review{gap:8px;border:1.5px solid var(--accsoft)}.grade{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}.grade.g{background:var(--accsoft);color:var(--acc)}.grade.y{background:#FFF4D6;color:#8A6200}.grade.r{background:var(--warnsoft);color:var(--warn)}.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:12px;color:var(--sub)}.rstats span{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:6px 8px}.rstats b{font-size:16px;color:var(--ink)}.rstats small{font-size:11px}.rfix{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.sessbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:linear-gradient(to bottom,transparent,var(--bg) 35%);z-index:20}.sessbar .btn{width:100%}.hassess .page{padding-bottom:180px}.hassess .timer{bottom:calc(136px + env(safe-area-inset-bottom))}.hassess.hastimer .page{padding-bottom:310px}
.wchart{width:100%;height:auto;display:block;overflow:visible}.wchart .gl{stroke:var(--line);stroke-width:1}.wchart .vl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.wchart text{font-size:10.5px;fill:var(--sub)}.wchart .xl{text-anchor:middle}.wchart .wl{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.wchart .wp{fill:var(--card);stroke:var(--acc);stroke-width:2.5}.wchart .wp.on{fill:var(--acc)}.wfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.g2{gap:2px}
.chipbtn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.wrap{flex-wrap:wrap}.hl{color:var(--acc)}.tag{font-size:10.5px;padding:2px 6px;border-radius:999px;background:var(--warnsoft);color:var(--warn);font-weight:600}.tag.rec{background:var(--accsoft);color:var(--acc);margin-left:4px;vertical-align:2px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:3px}
.seg button{height:36px;border-radius:9px;font-size:13px;color:var(--sub)}.seg button.on{background:var(--acc);color:#fff;font-weight:700}
.tile{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:flex-end;z-index:20;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.qty{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 4px;font-size:13px}.qty button{width:26px;height:26px;border-radius:13px;background:var(--bg);font-weight:800}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--sub);padding:4px 0}.tabbar button.on{color:var(--acc);font-weight:800}
.timer{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#1C1C1A;color:#fff;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:25;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.timer button{height:38px;border-radius:10px;background:#33332F;color:#fff;font-size:13px}.timer button.go{background:var(--mint);color:#10241B;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}body.locked{position:fixed;left:0;right:0;overflow:hidden}.modal{overscroll-behavior:contain;touch-action:none}.sheetbox{touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}.sheetbox::-webkit-scrollbar{display:none}
.sheetbox{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.sheetbox ol,.sheetbox ul{margin:0;padding-left:20px}.sheetbox li{margin:3px 0}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.imgs img{width:100%;border-radius:10px;background:#fff}
.pdot{width:32px;height:32px;border-radius:16px;display:block}.pdot.s{width:10px;height:10px;display:inline-block;margin-right:4px;vertical-align:-1px}
.pdot.g{background:#1F7A5C}.pdot.y{background:#F2C230}.pdot.o{background:#E07B2E}.pdot.r{background:#B3261E}.pdot.none{border:2px dashed #B4B3AD}
.cc{align-items:center}.hastimer .page{padding-bottom:250px}.qn{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px}
.partgrid{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;gap:8px;align-items:center}
.note{background:var(--warnsoft);color:var(--warn);border-radius:10px;padding:9px 11px;font-size:13px}
.warn{background:var(--warnsoft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px}
.chart{width:100%;height:auto}.chart text{fill:var(--sub);font-size:10px}
.kv{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12.5px}.kv code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);padding:4px 6px;border-radius:6px}
.guide{margin:0;padding-left:18px}.guide li{margin:4px 0}code{font-size:12px}
.auth{max-width:420px;margin:60px auto;padding:20px;display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
